<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Southern Cross Music">
  <!-- original artwork for the link: the Southern Cross over a night sky, and a note -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#2a3a66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.45" stop-color="#f2c46d"/>
      <stop offset="1" stop-color="#f2c46d" stop-opacity="0"/>
    </radialGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <circle r="10" fill="url(#glow)"/>
      <path d="M0 -9 L1.6 -1.6 L9 0 L1.6 1.6 L0 9 L-1.6 1.6 L-9 0 L-1.6 -1.6 Z" fill="#fff8e6"/>
    </symbol>
  </defs>
  <rect width="160" height="160" rx="22" fill="url(#sky)"/>
  <!-- faint stars -->
  <g fill="#c9d6ee" opacity="0.55">
    <circle cx="22" cy="28" r="1"/><circle cx="135" cy="22" r="1.2"/><circle cx="140" cy="70" r="0.9"/>
    <circle cx="18" cy="96" r="1.1"/><circle cx="60" cy="18" r="0.8"/><circle cx="118" cy="132" r="1"/>
    <circle cx="36" cy="140" r="0.9"/><circle cx="100" cy="52" r="0.7"/>
  </g>
  <!-- the Southern Cross (Crux): Gacrux top, Acrux bottom, Becrux left, Delta right, Epsilon small -->
  <use href="#star" x="68" y="18" width="22" height="22"/>
  <use href="#star" x="62" y="100" width="28" height="28"/>
  <use href="#star" x="36" y="56" width="24" height="24"/>
  <use href="#star" x="98" y="48" width="18" height="18"/>
  <use href="#star" x="86" y="74" width="12" height="12"/>
  <!-- a note -->
  <g fill="#f2c46d">
    <ellipse cx="118" cy="122" rx="9" ry="6.5" transform="rotate(-20 118 122)"/>
    <rect x="125" y="86" width="3.2" height="36" rx="1.2"/>
    <path d="M126.5 86 q14 4 12 18 q-3 -9 -12 -9 Z"/>
  </g>
</svg>
