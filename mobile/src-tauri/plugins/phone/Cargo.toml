[package]
name = "tauri-plugin-phone"
version = "0.1.0"
description = "What the Bible app needs from the phone itself: the share sheet, the phone's voice, and saving and opening a file"
authors = ["BadBull22"]
edition = "2021"
links = "tauri-plugin-phone"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
