<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Stage view</title>
<style>
  :root { color-scheme: dark; --bg: #080c16; --card: #141b30; --fg: #f3f5fb; --muted: #9aa6c7; --accent: #4f86cf; --warn: #c0562f; --gold: #f2c46d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 100vh; }
  #top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #part { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #clock { font-size: 1.6rem; color: var(--fg); }
  #timer { font-size: 1.6rem; color: var(--gold); }
  #timer.warn { color: #ff7a59; }
  #count { white-space: nowrap; }
  #main { flex: 1; display: grid; grid-template-columns: 1fr; grid-template-rows: auto; gap: 8px; min-height: 0; }
  @media (min-aspect-ratio: 4/3) { #main { grid-template-columns: 3fr 2fr; } }
  .card { background: var(--card); border-radius: 12px; padding: 12px 16px; min-width: 0; overflow: auto; }
  .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  #now { display: flex; flex-direction: column; justify-content: center; text-align: center; min-height: 34vh; }
  #now-title { font-size: 1.1rem; color: var(--gold); margin: 0 0 6px; font-weight: 700; }
  #now-body { white-space: pre-wrap; margin: 0; font-family: Georgia, serif; font-size: 2rem; line-height: 1.25; }
  #now.black #now-body, #now.black #now-title { opacity: 0.25; }
  #side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #next-title { font-weight: 700; margin: 0 0 2px; color: var(--gold); }
  #next-body { white-space: pre-wrap; margin: 0; font-family: Georgia, serif; font-size: 1.2rem; color: #d6dcef; }
  #notes-card { border-left: 4px solid var(--accent); flex: 1; }
  #notes { white-space: pre-wrap; margin: 0; font-size: 1.15rem; }
  .pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button { font: inherit; color: var(--fg); background: #26325a; border: 0; border-radius: 14px; padding: 12px 8px; min-height: 52px; font-weight: 700; touch-action: manipulation; }
  button:active { filter: brightness(1.3); }
  button.go { background: var(--accent); }
  button.on { background: var(--warn); }
  #lost { background: var(--warn); border-radius: 10px; padding: 8px 12px; text-align: center; }
</style>
</head>
<body>
<div id="top"><span id="part">Stage view</span><span id="count"></span><span id="timer" title="How long the show has been going (or time left)"></span><span id="clock"></span></div>
<div id="lost" hidden>Lost the connection to the computer. Check you are on the same Wi-Fi.</div>
<div id="main">
  <div class="card" id="now"><div class="label">On the screen</div><p id="now-title">Waiting for the show to start…</p><p id="now-body"></p></div>
  <div id="side">
    <div class="card"><div class="label">Next</div><p id="next-title"></p><p id="next-body"></p></div>
    <div class="card" id="notes-card"><div class="label">Your notes</div><p id="notes"></p></div>
  </div>
</div>
<div class="pad">
  <button data-k="back">&larr; Back</button>
  <button data-k="black" id="black">Black</button>
  <button class="go" data-k="next">Next &rarr;</button>
</div>
<script>
(function () {
  var base = location.pathname.replace(/\/stage\/?$/, "").replace(/\/+$/, "");
  var $ = function (id) { return document.getElementById(id); };
  var offset = 0;       // the computer's clock minus this device's
  var began = 0, count = 0;
  function lost(on) { $("lost").hidden = !on; }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function span(s) { var a = Math.abs(Math.round(s)); var t = a >= 3600 ? Math.floor(a / 3600) + ":" + two(Math.floor(a / 60) % 60) + ":" + two(a % 60) : Math.floor(a / 60) + ":" + two(a % 60); return s < 0 ? "-" + t : t; }
  function tick() {
    var d = new Date(); $("clock").textContent = d.getHours() + ":" + two(d.getMinutes());
    if (began) {
      var el = (Date.now() + offset - began) / 1000;
      var left = count ? count - el : null;
      $("timer").textContent = span(left !== null ? left : el);
      $("timer").className = left !== null && left < 60 ? "warn" : "";
    } else { $("timer").textContent = ""; }
  }
  function size(len) { return len > 360 ? "1.2rem" : len > 220 ? "1.5rem" : len > 120 ? "1.9rem" : len > 50 ? "2.4rem" : "3rem"; }
  function send(k) {
    fetch(base + "/key", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k: k }) })
      .then(function (r) { if (!r.ok) throw new Error(); if (navigator.vibrate) navigator.vibrate(25); poll(); })
      .catch(function () { lost(true); });
  }
  function render(s) {
    if (s.idle) { $("now-title").textContent = "Waiting for the show to start…"; $("now-body").textContent = ""; $("count").textContent = ""; return; }
    $("part").textContent = s.part || "Stage view";
    $("count").textContent = (s.index + 1) + " / " + s.total;
    var n = s.now || {};
    $("now-title").textContent = n.title || (s.black ? "Black" : "");
    $("now-body").textContent = n.body || "";
    $("now-body").style.fontSize = size((n.body || "").length);
    $("now").className = "card" + (s.black ? " black" : "");
    var x = s.next;
    $("next-title").textContent = x ? (x.title || "") : "";
    $("next-body").textContent = x ? (x.body || (x.title ? "" : "(next slide)")) : "That is the last slide";
    $("notes").textContent = s.notes || "No notes for this slide.";
    $("black").className = s.black ? "on" : "";
    began = s.began || 0; count = s.count || 0;
  }
  function poll() {
    fetch(base + "/state", { cache: "no-store" })
      .then(function (r) { var t = Number(r.headers.get("X-Server-Time")); if (t) offset = t - Date.now(); if (!r.ok) throw new Error(); return r.json(); })
      .then(function (s) { lost(false); render(s); })
      .catch(function () { lost(true); });
  }
  Array.prototype.forEach.call(document.querySelectorAll("button[data-k]"), function (b) { b.onclick = function () { send(b.getAttribute("data-k")); }; });
  setInterval(poll, 700); setInterval(tick, 500); poll(); tick();
})();
</script>
</body>
</html>
