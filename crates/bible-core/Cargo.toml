[package]
name = "bible-core"
version = "0.1.0"
edition = "2021"
description = "What the desktop and the phone app share: reading SWORD, e-Sword and MySword modules, Bible references, and keeping devices in step through a shared folder. No Tauri in it."
publish = false

[dependencies]
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
unicode-normalization = "0.1"
tar = { version = "0.4", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
