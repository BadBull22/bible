<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1f2430; --muted:#6b6f7a; --line:#dcd6c8; --accent:#2f5fb3; --ok:#2e7d32; --warn:#b26a00; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171e; --card:#1d222c; --ink:#ece9e1; --muted:#9aa0ac; --line:#323948; --accent:#7aa2f0; --ok:#6fcf74; --warn:#e6b04a; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding:14px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
  header h1 { font-size:22px; margin:0; }
  nav button { font:inherit; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:8px 16px; border-radius:999px; cursor:pointer; margin-right:6px; }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:19px; margin:0 0 10px; }
  .muted { color:var(--muted); }
  .chips span { display:inline-block; padding:3px 12px; border-radius:999px; font-size:14px; border:1px solid var(--line); margin:0 6px 6px 0; }
  .st-built-in, .st-published { color:var(--ok); border-color:var(--ok)!important; }
  .st-approved { color:var(--accent); border-color:var(--accent)!important; }
  .st-draft { color:var(--warn); border-color:var(--warn)!important; }
  .row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { flex:1; } .row .r { color:var(--muted); font-size:14px; min-width:150px; }
  button.b { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.b.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.b.good { background:var(--ok); color:#fff; border-color:var(--ok); }
  button.b:disabled { opacity:.45; cursor:default; }
  label { display:block; font-weight:600; margin:14px 0 4px; }
  input[type=text], textarea, select { width:100%; font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  textarea { min-height:90px; resize:vertical; }
  .count { font-weight:400; font-size:14px; margin-left:8px; }
  .count.ok { color:var(--ok); } .count.bad { color:var(--bad); }
  .grid { display:grid; grid-template-columns: 300px 1fr; gap:18px; } @media (max-width: 860px) { .grid { grid-template-columns:1fr; } }
  /* the list of drafts and the draft itself scroll separately, so the list stays where it is while a story is read and approved */
  @media (min-width: 861px) {
    .grid.drafts { height: calc(100vh - 118px); align-items: stretch; }
    .grid.drafts > .list, .grid.drafts > #ed { height: 100%; overflow-y: auto; overscroll-behavior: contain; margin-bottom: 0; }
    .grid.drafts > .list { padding-right: 10px; }
  }
  .li { display:flex; gap:8px; align-items:flex-start; margin-bottom:6px; }
  .li input[type=checkbox] { margin-top:12px; width:18px; height:18px; flex:none; }
  .li button { margin-bottom:0 !important; flex:1; }
  .li .kidnote { font-size:12px; color:var(--muted); }
  .list button { display:block; width:100%; text-align:left; font:inherit; padding:9px 12px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; margin-bottom:6px; cursor:pointer; }
  .list button.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
  .verse { margin:4px 0; font-family:Georgia, serif; } .verse sup { color:var(--muted); margin-right:3px; }
  .problem { color:var(--bad); margin:4px 0; }
  .passes { color:var(--ok); font-weight:600; }
  .sub { margin:6px 0 0; font-size:14px; color:var(--muted); }
  .preview h3 { margin:14px 0 4px; font-size:16px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .preview .sum { font-size:18px; line-height:1.6; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .filter label { display:inline-block; font-weight:400; margin:0 14px 0 0; }
  .ptiles { display:flex; flex-wrap:wrap; gap:10px; } .pt { width:150px; padding:6px; border:2px solid var(--line); background:var(--card); border-radius:10px; cursor:pointer; color:var(--ink); font:inherit; font-size:12px; text-align:left; }
  .pt img { width:100%; height:110px; object-fit:cover; border-radius:6px; display:block; margin-bottom:4px; } .pt.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Story Studio</h1>
  <nav>
    <button data-tab="board" class="on">What to write</button>
    <button data-tab="drafts">Drafts</button>
    <button data-tab="make">Make the file</button>
  </nav>
  <span class="muted" id="top"></span>
</header>
<main id="main"></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const words = (s) => (String(s || "").trim().match(/\S+/g) || []).length;
let S = null, tab = "board", current = null, draft = null, kidDraft = null, kidId = null, kidResult = null, existing = [], checkResult = null, filter = "todo", openGroups = {}, listMode = "kids";

async function api(path, body) {
  const r = await fetch(path, body === undefined ? undefined : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
async function load() { S = await api("/api/state"); $("#top").textContent = `In the app: ${S.counts.builtIn} stories. Added by fetch: ${S.counts.published}. Drafts: ${S.counts.drafts}.`; render(); }
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b)); render(); });

const STATUS = { "built-in": "In the app", published: "Added (fetch)", approved: "Approved", draft: "Draft", todo: "Not written" };

function render() { if (!S) return; ({ board: renderBoard, drafts: renderDrafts, make: renderMake })[tab](); }

// ---------------------------------------------------------------- the board
function renderBoard() {
  const rows = S.board.filter((w) => filter === "all" ? true : filter === "wanted" ? w.wanted : filter === "todo" ? w.status === "todo" : filter === "drafts" ? ["draft", "approved"].includes(w.status) : ["built-in", "published"].includes(w.status));
  const groups = [...new Set(rows.map((w) => w.group))];
  const n = (st) => S.board.filter((w) => w.status === st).length;
  $("#main").innerHTML = `
    <div class="card"><h2>What to write</h2>
      <p class="muted">The owner's list of 100, suggested additions, and what is already done. Tick "I want this" to mark the stories to write next.</p>
      <div class="chips"><span class="st-built-in">In the app: ${n("built-in")}</span><span class="st-published">Added by fetch: ${n("published")}</span><span class="st-approved">Approved: ${n("approved")}</span><span class="st-draft">Drafts: ${n("draft")}</span><span>Not written: ${n("todo")}</span><span>Wanted: ${S.board.filter((w) => w.wanted).length}</span></div>
      <div class="filter">Show: ${[["todo", "Not written"], ["wanted", "Wanted"], ["drafts", "Drafts and approved"], ["done", "Done"], ["all", "Everything"]].map(([k, t]) => `<label><input type="radio" name="f" value="${k}" ${filter === k ? "checked" : ""}> ${t}</label>`).join("")}</div>
    </div>
    ${groups.map((g) => `<div class="card"><h2>${esc(g)} <span class="muted" style="font-weight:400;font-size:15px">(${rows.filter((w) => w.group === g).length})</span></h2>
      ${rows.filter((w) => w.group === g).map((w) => `<div class="row"><input type="checkbox" data-n="${w.n}" ${w.wanted ? "checked" : ""} ${w.status !== "todo" ? "disabled" : ""} title="I want this"><span class="t">${esc(w.title)}</span><span class="r">${esc(w.ref)}</span><span class="chips"><span class="st-${w.status}">${STATUS[w.status]}</span></span></div>`).join("")}</div>`).join("") || `<div class="card muted">Nothing here.</div>`}`;
  document.querySelectorAll("input[name=f]").forEach((r) => r.onchange = () => { filter = r.value; renderBoard(); });
  document.querySelectorAll("input[data-n]").forEach((c) => c.onchange = async () => {
    const all = S.board.filter((w) => w.wanted).map((w) => w.n).filter((n) => n !== +c.dataset.n);
    if (c.checked) all.push(+c.dataset.n);
    await api("/api/wanted", { numbers: all }); await load();
  });
}

// ---------------------------------------------------------------- drafts
let lastShown = null;
function renderDrafts() {
  const keepList = $("#dl") ? $("#dl").scrollTop : 0;
  const keepEd = $("#ed") && lastShown === current ? $("#ed").scrollTop : 0;
  const kw = new Set(S.kidsWanted || []);
  const kidOf = (d) => S.children.find((c) => c.story === d.id || c.id === d.child);
  const item = (d, kind) => {
    const k = kind === "story" ? kidOf(d) : null;
    const box = kind === "story" ? (k ? `<input type="checkbox" checked disabled title="This story has a children's page">` : `<input type="checkbox" data-kw="${d.id}" ${kw.has(d.id) ? "checked" : ""} title="Tick: this story needs a children's page">`) : "";
    const note = kind === "story" ? (k ? `<span class="kidnote">children's page: ${STATUS[k.status] || k.status}</span>` : kw.has(d.id) ? `<span class="kidnote">children's page: to be written</span>` : "") : "";
    return `<div class="li">${box}<button data-id="${d.id}" data-kind="${kind}" class="${current === d.id ? "on" : ""}">${esc(d.title)}<br><span class="chips"><span class="st-${d.status}">${STATUS[d.status] || d.status}</span></span> ${note}</button></div>`;
  };
  const nWanted = S.drafts.filter((d) => kw.has(d.id) && !kidOf(d)).length;
  const kidsOnly = listMode === "kids";
  const modeBar = `<div class="actions" style="margin:0 0 8px"><button type="button" class="b ${kidsOnly ? "primary" : ""}" id="mkids">Children's pages only</button> <button type="button" class="b ${kidsOnly ? "" : "primary"}" id="mall">Stories and children's pages</button></div>`;
  $("#main").innerHTML = `<div class="grid drafts"><div class="list card" id="dl">${modeBar}${kidsOnly ? "" : `<h2>Stories</h2><p class="muted sub" style="margin-top:-4px">Tick the small box on a story that needs a children's page: ${nWanted} ticked. Tell the helper to write them, and each story is then read together with its children's page.</p>${S.drafts.map((d) => item(d, "story")).join("") || `<p class="muted">No drafts yet. Stories marked "I want this" are written for you and appear here.</p>`}`}${S.children.length ? `<h2 style="margin-top:14px">Children's pages</h2>${S.children.map((d) => item(d, "child")).join("")}` : ""}</div><div id="ed"></div></div>`;
  $("#mkids").onclick = () => { listMode = "kids"; renderDrafts(); }; $("#mall").onclick = () => { listMode = "all"; renderDrafts(); };
  document.querySelectorAll("#dl button[data-kind]").forEach((b) => b.onclick = () => (b.dataset.kind === "child" ? openChild(b.dataset.id) : openDraft(b.dataset.id)));
  document.querySelectorAll("#dl input[data-kw]").forEach((c) => c.onchange = async () => {
    const ids = new Set(S.kidsWanted || []);
    if (c.checked) ids.add(c.dataset.kw); else ids.delete(c.dataset.kw);
    S.kidsWanted = [...ids];
    await api("/api/kidswanted", { ids: S.kidsWanted });
    const y = $("#dl").scrollTop; renderDrafts(); $("#dl").scrollTop = y;
  });
  if (current && kidDraft && kidId === current) renderChild(); else if (current && draft) renderEditor();
  $("#dl").scrollTop = keepList;
  if ($("#ed")) $("#ed").scrollTop = keepEd;
  lastShown = current;
}
async function openDraft(id) { const d = await api(`/api/draft?id=${id}`); d.kid = d.page && d.page.child_page ? await api(`/api/cdraft?id=${d.page.child_page}`) : null; if (d.kid && !d.kid.page) d.kid = null; current = id; draft = d; kidDraft = null; kidId = null; existing = d.existingIds; checkResult = null; lastShown = null; renderDrafts(); }

function counter(label, n, lo, hi) { const ok = n >= lo && n <= hi; return `<span class="count ${ok ? "ok" : "bad"}">${n} words (${lo} to ${hi})</span>`; }

function renderEditor() {
  const p = draft.page, st = p.review?.status ?? "draft";
  $("#ed").innerHTML = `<div class="card">
    <h2>${esc(p.title)} <span class="chips"><span class="st-${st}">${STATUS[st]}</span></span></h2>
    <label>Title <span class="count ${p.title && p.title.length <= 60 ? "ok" : "bad"}">${(p.title || "").length}/60</span></label><input type="text" id="f_title" value="${esc(p.title)}">
    <label>Other names people search by (one per line, up to 6)</label><textarea id="f_also" style="min-height:70px">${esc((p.also || []).join("\n"))}</textarea>
    <label>The story <span id="c_sum">${counter("", words(p.summary), 40, 170)}</span></label><textarea id="f_summary" style="min-height:230px">${esc(p.summary)}</textarea>
    <label>Look closer (one thing to notice) <span id="c_look">${counter("", words(p.look_closer), 0, 60)}</span></label><textarea id="f_look">${esc(p.look_closer || "")}</textarea>
    <label>What this teaches us (one lesson per line, 1 to 5, each 8 to 50 words, ending with its verse in brackets)</label><textarea id="f_lessons" style="min-height:170px">${esc((p.lessons || []).join("\n"))}</textarea>
    <label>Passages (one per line: <code>Mark 5:25-29 | label</code>)</label><textarea id="f_passages" style="min-height:100px">${esc((p.passages || []).map((x) => `${x.ref} | ${x.label}`).join("\n"))}</textarea>
    <label>Read first (optional: <code>Mark 5:21-24 | label</code>)</label><input type="text" id="f_context" value="${esc(p.context ? `${p.context.ref} | ${p.context.label}` : "")}">
    <label>The whole story (optional: one chapter that holds every passage)</label><input type="text" id="f_whole" value="${esc(p.whole || "")}">
    <label>The same event in other Gospels (references, comma separated)</label><input type="text" id="f_parallels" value="${esc((p.parallels || []).join(", "))}">
    <label>Also read (references, comma separated)</label><input type="text" id="f_alsoread" value="${esc((p.also_read || []).join(", "))}">
    <label>Tags (comma separated; choose from: ${esc(S.tags.join(", "))})</label><input type="text" id="f_tags" value="${esc((p.tags || []).join(", "))}">
    <label>Related stories (ids, comma separated)</label><input type="text" id="f_related" value="${esc((p.related || []).join(", "))}">
    <label>Hidden search words (comma separated, up to 20)</label><input type="text" id="f_keywords" value="${esc((draft.keywords || []).join(", "))}">
    <label>Picture</label>
    <div id="pic"></div>
    <div class="actions">
      <button class="b" id="save">Save</button>
      <button class="b primary" id="check">Check the words</button>
      <button class="b good" id="approve" ${st === "approved" ? "disabled" : ""}>I have read every word: Approve</button>
      <button class="b" id="unapprove" ${st !== "approved" ? "disabled" : ""}>Take back my approval</button>
      ${draft.kid ? `<button class="b good" id="approveboth" ${st === "approved" && draft.kid.page.review?.status === "approved" ? "disabled" : ""}>Approve the story AND its children's page</button>` : ""}
      <button class="b good" id="approvenext" ${st === "approved" ? "disabled" : ""}>Approve and open the next draft</button>
      <button class="b" id="kids">${p.child_page ? "Open its children's page" : "Start a children's page for this story"}</button>
    </div>
    <div id="result"></div>
  </div>
  <div class="card preview"><h2>How it reads</h2><div id="pv">Loading…</div></div>`;
  ["summary", "look"].forEach((k) => $("#f_" + k).oninput = () => { const t = $("#f_" + k).value; $("#c_" + (k === "summary" ? "sum" : "look")).innerHTML = k === "summary" ? counter("", words(t), 40, 170) : counter("", words(t), 0, 60); });
  $("#kids").onclick = async () => { await save(); const r = p.child_page ? { id: p.child_page } : await api("/api/cnew", { story: current }); if (r.id) { await load(); await openChild(r.id); } else alert(r.error || "Could not start it."); };
  const ab = $("#approveboth"); if (ab) ab.onclick = approveBoth;
  const an = $("#approvenext"); if (an) an.onclick = approveNext;
  $("#save").onclick = save; $("#check").onclick = doCheck; $("#approve").onclick = () => approve(true); $("#unapprove").onclick = () => approve(false);
  if (checkResult) showResult();
  preview(); pictureBox();
}

const lines = (id) => $("#" + id).value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
const csv = (id) => $("#" + id).value.split(",").map((s) => s.trim()).filter(Boolean);
const refLabel = (s) => { const [ref, ...rest] = s.split("|"); return { ref: ref.trim(), label: rest.join("|").trim() }; };

function collect() {
  const p = structuredClone(draft.page);
  p.title = $("#f_title").value.trim();
  p.also = lines("f_also");
  p.summary = $("#f_summary").value.trim();
  const look = $("#f_look").value.trim(); if (look) p.look_closer = look; else delete p.look_closer;
  p.lessons = lines("f_lessons");
  p.passages = lines("f_passages").map(refLabel);
  const ctx = $("#f_context").value.trim(); if (ctx) p.context = refLabel(ctx); else delete p.context;
  const whole = $("#f_whole").value.trim(); if (whole) p.whole = whole; else delete p.whole;
  const par = csv("f_parallels"); if (par.length) p.parallels = par; else delete p.parallels;
  const ar = csv("f_alsoread"); if (ar.length) p.also_read = ar; else delete p.also_read;
  p.tags = csv("f_tags"); p.related = csv("f_related");
  return { page: p, keywords: csv("f_keywords"), wanted: draft.wanted ?? null, picture: draft.picture ?? null };
}
async function save() {
  const d = collect();
  const r = await api("/api/draft", { id: current, draft: d });
  draft = { ...d, page: { ...d.page, review: { ...(d.page.review || {}), status: r.status } }, existingIds: existing, kid: draft.kid };
  checkResult = null; await load(); renderDrafts();
}
async function doCheck() {
  await save();
  $("#result").innerHTML = `<p class="muted">Checking against the app's rules (the Bibles, the writing rules, the links between pages). This takes up to a minute…</p>`;
  checkResult = await api("/api/check", { id: current }); showResult();
}
function showResult() {
  $("#result").innerHTML = checkResult.ok ? `<p class="passes">All the app's checks passed.</p>` : `<p class="problem"><b>Not yet:</b></p>${(checkResult.lines.length ? checkResult.lines : [checkResult.raw]).map((l) => `<div class="problem">${esc(l)}</div>`).join("")}`;
}
async function approve(on) {
  if (on && !checkResult?.ok && !confirm("The checks have not passed (or have not been run) in this window. Approve anyway?\n\nThe file builder will still refuse the page if it breaks a rule.")) return;
  if (on && !confirm("Approving means you have read every word of this story and it may go to the phone.\n\nApprove it?")) return;
  await save(); await api("/api/approve", { id: current, approve: on }); await load(); await openDraft(current);
}
async function approveBoth() {
  if (!checkResult?.ok && !confirm("The checks have not passed (or have not been run) in this window. Approve anyway?")) return;
  if (!confirm("Approving means you have read every word of the story AND its children's page and both may go to the phone.\n\nApprove both?")) return;
  await save(); await api("/api/approve", { id: current, approve: true }); await api("/api/capprove", { id: draft.page.child_page, approve: true });
  await load(); await openDraft(current);
}
async function approveNext() {
  if (!checkResult?.ok && !confirm("The checks have not passed (or have not been run) in this window. Approve anyway?")) return;
  if (!confirm("Approving means you have read every word of this story and it may go to the phone.\n\nApprove it and open the next draft?")) return;
  const here = current;
  await save(); await api("/api/approve", { id: here, approve: true }); await load();
  const i = S.drafts.findIndex((d) => d.id === here);
  const next = S.drafts.slice(i + 1).concat(S.drafts.slice(0, i)).find((d) => d.status !== "approved");
  await openDraft(next ? next.id : here);
  const btn = document.querySelector(`#dl button[data-id="${(next || { id: here }).id}"]`); if (btn) btn.scrollIntoView({ block: "nearest" });
}
async function preview() {
  const p = collect().page; const out = [];
  out.push(`<div class="sum">${esc(p.summary)}</div>`);
  if (p.look_closer) out.push(`<h3>Look closer</h3><p>${esc(p.look_closer)}</p>`);
  if (p.context) out.push(`<h3>Read first</h3><p><b>${esc(p.context.ref)}</b> ${esc(p.context.label)}</p>`);
  for (const ps of p.passages) {
    const v = await api(`/api/verses?ref=${encodeURIComponent(ps.ref)}`);
    out.push(`<h3>${esc(ps.ref)}: ${esc(ps.label)}</h3>${v.length ? v.map((x) => `<div class="verse"><sup>${x.verse}</sup>${esc(x.text)}</div>`).join("") : `<p class="problem">This reference is not in the Bible (check the spelling: the app says Psalms, never Psalm).</p>`}`);
  }
  if (p.lessons?.length) out.push(`<h3>What this teaches us</h3><ul>${p.lessons.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`);
  if (draft.kid && draft.kid.page && draft.kid.page.retelling) {
    const k = draft.kid.page;
    out.push(`<hr><h2>Its children's page (ages ${esc(k.age)}): ${esc(k.title)} <span class="chips"><span class="st-${k.review?.status || "draft"}">${STATUS[k.review?.status || "draft"]}</span></span></h2>`);
    out.push((k.retelling || []).map((x) => `<p class="sum">${esc(x)}</p>`).join(""));
    out.push(`<h3>The big idea</h3><p>${esc(k.message)}</p><h3>Memory verse: ${esc(k.memory?.ref)}</h3><h3>Talk about it</h3><ol>${(k.questions || []).map((q) => `<li>${esc(q.q)}<br><span class="muted">${esc(q.a)}</span></li>`).join("")}</ol>${k.try_this ? `<h3>Try this</h3><p>${esc(k.try_this)}</p>` : ""}`);
  }
  const el = $("#pv"); if (el) el.innerHTML = out.join("");
}

// ---------------------------------------------------------------- the picture of a story
const chaptersOf = (p) => {
  const out = [], seen = new Set();
  const add = (ref) => { const m = /^(.+?) (\d+):/.exec(ref || ""); if (m && !seen.has(m[1] + m[2])) { seen.add(m[1] + m[2]); out.push([m[1], +m[2]]); } };
  (p.passages || []).forEach((x) => add(x.ref)); if (p.context) add(p.context.ref); (p.parallels || []).forEach(add);
  return out;
};
async function pictureBox() {
  const box = $("#pic"); if (!box) return;
  const cur = draft.picture?.id;
  const p = collect().page; let list = [];
  for (const [b, c] of chaptersOf(p)) list = list.concat(await api(`/api/pictures?book=${encodeURIComponent(b)}&chapter=${c}`));
  const uniq = [...new Map(list.map((x) => [x.id, x])).values()];
  const have = uniq.filter((x) => x.downloaded && x.collection !== "sweet");
  const sweet = uniq.filter((x) => x.downloaded && x.collection === "sweet");
  const tile = (x) => `<button type="button" class="pt ${x.id === cur ? "on" : ""}" data-pid="${esc(x.id)}" title="${esc(x.title)}"><img src="/api/picfile?id=${encodeURIComponent(x.id)}" loading="lazy" alt="${esc(x.title)}"><span>${esc(x.title.slice(0, 42))}</span></button>`;
  box.innerHTML = `<p class="muted sub">${cur ? `Chosen: ${esc(cur)}` : "No picture chosen yet."} The pictures offered are the ones already downloaded on this computer (Explore, Pictures) for this story's chapters. Click one to choose it; the credit and licence are added for you. Then press Save.</p>
    <div class="ptiles">${[...have, ...sweet].map(tile).join("") || `<span class="muted">No downloaded painting for these chapters.</span>`}</div>
    <div class="actions"><button type="button" class="b" id="nopic" ${cur ? "" : "disabled"}>No picture</button></div>`;
  box.querySelectorAll(".pt").forEach((b) => b.onclick = () => { draft.picture = { id: b.dataset.pid }; pictureBox(); });
  const n = $("#nopic"); if (n) n.onclick = () => { draft.picture = null; pictureBox(); };
}


// ---------------------------------------------------------------- children's pages
async function openChild(id) { const d = await api(`/api/cdraft?id=${id}`); current = id; kidId = id; kidDraft = d; draft = null; kidResult = null; lastShown = null; renderDrafts(); }
const sentences = (s) => String(s || "").split(/(?<=[.!?])["'”’)]*\s+/).map((x) => x.trim()).filter(Boolean);
const avgLen = (s) => { const n = sentences(s); return n.length ? words(s) / n.length : 0; };
const AGE_AVG = { "3-5": 12, "6-8": 12, "9-12": 16 }, AGE_WORDS = { "3-5": 6, "6-8": 8, "9-12": 10 };
const kv = (id) => $("#" + id).value;

function renderChild() {
  const p = kidDraft.page, st = p.review?.status ?? "draft", q = p.questions || [{}, {}, {}];
  $("#ed").innerHTML = `<div class="card">
    <h2>${esc(p.title)} <span class="chips"><span class="st-${st}">${STATUS[st]}</span></span></h2>
    <p class="muted sub">A children's page for the story <b>${esc(p.story)}</b>. Write for the child: short sentences, concrete, warm; Jesus is "he"; nothing frightening.</p>
    ${(p.retelling || []).join("").trim() ? "" : `<p class="problem"><b>This page starts empty.</b> The words are written in the chat: say "write the children's page for ${esc(p.title)}, ages ${esc(p.age)}" and it fills in here (press the story's name in the list again to see it). Or write it yourself in the boxes below.</p>`}
    <label>Title</label><input type="text" id="k_title" value="${esc(p.title)}">
    <label>Age</label><select id="k_age">${["3-5", "6-8", "9-12"].map((a) => `<option ${a === p.age ? "selected" : ""}>${a}</option>`).join("")}</select>
    <label>Read the real story together (one chapter, for example <code>Luke 2:41-52</code>)</label><input type="text" id="k_read" value="${esc(p.read_from)}">
    <label>The story in your own words (one short paragraph per line) <span id="k_c1"></span></label><textarea id="k_retelling" style="min-height:260px">${esc((p.retelling || []).join("\n"))}</textarea>
    <label>The big idea (1 to 3 short sentences) <span id="k_c2"></span></label><textarea id="k_message" style="min-height:70px">${esc(p.message)}</textarea>
    <label>Memory verse: one verse, for example <code>Psalms 147:3</code></label><input type="text" id="k_mem" value="${esc(p.memory?.ref)}">
    <label>Up to 4 words from that verse the app may blank (comma separated)</label><input type="text" id="k_blanks" value="${esc((p.memory?.blanks_hint || []).join(", "))}">
    ${[0, 1, 2].map((i) => `<label>Question ${i + 1}${i === 2 ? " (open: starts the answer with 'There is no wrong answer.' and points to Jesus or prayer)" : ""}</label><input type="text" id="k_q${i}" value="${esc(q[i]?.q)}"><label>Note for the helper: answer ${i + 1}</label><textarea id="k_a${i}" style="min-height:60px">${esc(q[i]?.a)}</textarea>`).join("")}
    <label>Try this (optional, up to 30 words) <span id="k_c3"></span></label><textarea id="k_try" style="min-height:60px">${esc(p.try_this)}</textarea>
    <label>Word-search words (capital letters, each must appear in the story; <span id="k_wmax"></span>) </label><input type="text" id="k_words" value="${esc((p.words || []).join(", "))}">
    <label>Do Christians differ about anything on this page?</label><select id="k_doc"><option value="plain" ${p.doctrine !== "needs_review" ? "selected" : ""}>No</option><option value="needs_review" ${p.doctrine === "needs_review" ? "selected" : ""}>Yes (write a short neutral note)</option></select>
    <textarea id="k_docnote" style="min-height:60px;${p.doctrine === "needs_review" ? "" : "display:none"}" placeholder="Christians differ about... This page says only what the text says.">${esc(p.doctrine_note || "")}</textarea>
    <label>Picture and outline to colour in</label><div id="kpic"></div>
    <div class="actions">
      <button class="b" id="ksave">Save</button>
      <button class="b primary" id="kcheck">Check the words</button>
      <button class="b good" id="kapprove" ${st === "approved" ? "disabled" : ""}>I have read every word: Approve</button>
      <button class="b" id="kunapprove" ${st !== "approved" ? "disabled" : ""}>Take back my approval</button>
    </div>
    <div id="kresult"></div>
  </div>
  <div class="card preview"><h2>How it reads</h2><div id="kpv"></div></div>`;
  const counts = () => {
    const r = kv("k_retelling"), age = kv("k_age"), n = words(r), av = avgLen(r);
    $("#k_c1").innerHTML = `<span class="count ${n >= 60 && n <= 220 ? "ok" : "bad"}">${n} words (60 to 220)</span> <span class="count ${av <= AGE_AVG[age] ? "ok" : "bad"}">average sentence ${av.toFixed(1)} (at most ${AGE_AVG[age]})</span>`;
    const m = words(kv("k_message")); $("#k_c2").innerHTML = `<span class="count ${m >= 6 && m <= 35 ? "ok" : "bad"}">${m} words (6 to 35)</span>`;
    const tr = words(kv("k_try")); $("#k_c3").innerHTML = `<span class="count ${tr <= 30 ? "ok" : "bad"}">${tr}/30</span>`;
    $("#k_wmax").textContent = `3 to ${AGE_WORDS[age]} words`;
  };
  ["k_retelling", "k_message", "k_try", "k_age"].forEach((id) => $("#" + id).oninput = counts); counts();
  $("#k_doc").onchange = () => { $("#k_docnote").style.display = $("#k_doc").value === "needs_review" ? "" : "none"; };
  $("#ksave").onclick = ksave; $("#kcheck").onclick = kcheck; $("#kapprove").onclick = () => kapprove(true); $("#kunapprove").onclick = () => kapprove(false);
  if (kidResult) kshow();
  kpreview(); kpicture();
}
const klines = (id) => $("#" + id).value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
const kcsv = (id) => $("#" + id).value.split(",").map((s) => s.trim()).filter(Boolean);
function kcollect() {
  const p = structuredClone(kidDraft.page);
  p.title = kv("k_title").trim(); p.age = kv("k_age"); p.read_from = kv("k_read").trim();
  p.retelling = klines("k_retelling"); p.message = kv("k_message").trim();
  p.memory = { ref: kv("k_mem").trim(), blanks_hint: kcsv("k_blanks") };
  p.questions = [0, 1, 2].map((i) => ({ q: kv("k_q" + i).trim(), a: kv("k_a" + i).trim() }));
  const tr = kv("k_try").trim(); if (tr) p.try_this = tr; else delete p.try_this;
  p.words = kcsv("k_words").map((w) => w.toUpperCase());
  p.doctrine = kv("k_doc"); if (p.doctrine === "needs_review") p.doctrine_note = kv("k_docnote").trim(); else delete p.doctrine_note;
  return { page: p, picture: kidDraft.picture ?? null };
}
async function ksave() {
  const d = kcollect(); const r = await api("/api/cdraft", { id: kidId, draft: d });
  kidDraft = { ...kidDraft, ...d, page: { ...d.page, review: { ...(d.page.review || {}), status: r.status } } }; kidResult = null; await load(); renderDrafts();
}
async function kcheck() {
  await ksave();
  $("#kresult").innerHTML = `<p class="muted">Checking against the app's rules. This takes up to a minute…</p>`;
  kidResult = await api("/api/check", { id: kidId, kind: "child" }); kshow();
}
function kshow() { $("#kresult").innerHTML = kidResult.ok ? `<p class="passes">All the app's checks passed.</p>` : `<p class="problem"><b>Not yet:</b></p>${(kidResult.lines.length ? kidResult.lines : [kidResult.raw]).map((l) => `<div class="problem">${esc(l)}</div>`).join("")}`; }
async function kapprove(on) {
  if (on && !kidResult?.ok && !confirm("The checks have not passed (or have not been run) in this window. Approve anyway?")) return;
  if (on && !confirm("Approving means you have read every word of this children's page and it may go to the phone.\n\nApprove it?")) return;
  await ksave(); await api("/api/capprove", { id: kidId, approve: on }); await load(); await openChild(kidId);
}
async function kpreview() {
  const p = kcollect().page; const out = [];
  out.push(`<p class="muted">Ages ${esc(p.age)}</p>`);
  out.push(p.retelling.map((x) => `<p class="sum">${esc(x)}</p>`).join(""));
  out.push(`<h3>The big idea</h3><p>${esc(p.message)}</p>`);
  const v = await api(`/api/verses?ref=${encodeURIComponent(p.read_from)}`);
  out.push(`<h3>Read the real story together: ${esc(p.read_from)}</h3>${v.length ? `<p class="muted">${v.length} verses from the Bible are shown here.</p>` : `<p class="problem">This reference is not in the Bible (one chapter, for example Luke 2:41-52).</p>`}`);
  const mv = await api(`/api/verses?ref=${encodeURIComponent(p.memory.ref)}`);
  out.push(`<h3>Memory verse: ${esc(p.memory.ref)}</h3>${mv.length === 1 ? `<div class="verse">${esc(mv[0].text)}</div>` : `<p class="problem">The memory verse must be ONE verse that exists in the Bible.</p>`}`);
  out.push(`<h3>Talk about it</h3><ol>${p.questions.map((q) => `<li>${esc(q.q)}<br><span class="muted">${esc(q.a)}</span></li>`).join("")}</ol>`);
  if (p.try_this) out.push(`<h3>Try this</h3><p>${esc(p.try_this)}</p>`);
  const el = $("#kpv"); if (el) el.innerHTML = out.join("");
}
async function kpicture() {
  const box = $("#kpic"); if (!box) return;
  const sp = kidDraft.storyPage || { passages: [], parallels: [] };
  const cur = kidDraft.picture?.id; let list = [];
  for (const [b, c] of chaptersOf(sp)) list = list.concat(await api(`/api/pictures?book=${encodeURIComponent(b)}&chapter=${c}`));
  const uniq = [...new Map(list.map((x) => [x.id, x])).values()];
  // the children's illustrations first, then the adult story's pictures (Tissot, Dore), then more from the same book, so there are always some to choose from
  let sweet = uniq.filter((x) => x.collection === "sweet");
  let adult = uniq.filter((x) => x.collection !== "sweet");
  let more = [];
  if (sweet.length + adult.length < 6) {
    const seen = new Set(uniq.map((x) => x.id)), books = [...new Set(chaptersOf(sp).map((c) => c[0]))];
    for (const b of books) more = more.concat(await api(`/api/pictures?book=${encodeURIComponent(b)}&chapter=0`));
    more = [...new Map(more.filter((x) => !seen.has(x.id)).map((x) => [x.id, x])).values()].slice(0, 24);
  }
  // the picture chosen for the adult page goes first
  const adultPick = kidDraft.adultPicture && kidDraft.adultPicture.id;
  if (adultPick) adult = [...adult.filter((x) => x.id === adultPick), ...adult.filter((x) => x.id !== adultPick)];
  const tile = (x) => `<button type="button" class="pt ${x.id === cur ? "on" : ""}" data-pid="${esc(x.id)}" title="${esc(x.title)}"><img src="${x.downloaded ? `/api/picfile?id=${encodeURIComponent(x.id)}` : esc(x.thumb || "")}" loading="lazy" alt=""><span>${esc(x.title.slice(0, 40))}${x.downloaded ? "" : " (online)"}</span></button>`;
  const group = (title, arr) => arr.length ? `<div class="muted sub" style="margin-top:8px"><b>${title}</b></div><div class="ptiles">${arr.map(tile).join("")}</div>` : "";
  const ol = cur ? `<div style="display:flex;gap:12px;flex-wrap:wrap;margin:8px 0"><div><div class="muted sub">Colour picture</div><img src="/api/picfile?id=${encodeURIComponent(cur)}" style="max-width:260px;border-radius:8px"></div><div><div class="muted sub">Outline to colour in (look at it: faces can be rough)</div><img src="/api/outlinefile?id=${encodeURIComponent(cur)}&t=${Date.now()}" onerror="this.replaceWith(document.createTextNode('No outline yet.'))" style="max-width:260px;border-radius:8px;border:1px solid var(--line);background:#fff"></div></div>` : "";
  box.innerHTML = `${ol}<p class="muted sub">${cur ? `Chosen: ${esc(cur)}.` : "No picture chosen yet."} These are the illustrations for the story's chapters, then the paintings the adult story uses, then more from the same book. Click one to choose it: if it is not on this computer yet it is fetched once (a few seconds), and the outline is made. Then press Save.</p>
    ${group("Children's illustrations for this story", sweet)}${group("The same paintings as the adult story (Tissot, Dore)", adult)}${group("More from the same book", more)}${sweet.length + adult.length + more.length ? "" : `<span class="muted">No pictures are listed for this book.</span>`}
    <div class="actions"><button type="button" class="b" id="knopic" ${cur ? "" : "disabled"}>No picture</button></div><div id="kpmsg" class="muted sub"></div>`;
  box.querySelectorAll(".pt").forEach((b) => b.onclick = async () => {
    $("#kpmsg").textContent = "Fetching the picture and making the outline…";
    const r = await api("/api/fetchpic", { id: b.dataset.pid, outline: true });
    if (!r.ok) { $("#kpmsg").innerHTML = `<span class="problem">${esc(r.error)}</span>`; return; }
    kidDraft.picture = { id: b.dataset.pid };
    await kpicture();
    if (r.outline && !r.outline.ok) $("#kpmsg").innerHTML = `<span class="problem">The outline could not be made: ${esc(r.outline.text)}</span>`;
  });
  const n = $("#knopic"); if (n) n.onclick = () => { kidDraft.picture = null; kpicture(); };
}

// ---------------------------------------------------------------- make the file
function renderMake() {
  const appr = S.drafts.filter((d) => d.status === "approved"), apprKids = S.children.filter((d) => d.status === "approved");
  $("#main").innerHTML = `<div class="card"><h2>Make the file the phone fetches</h2>
    <p>The file holds every story added so far (${S.counts.published}) plus the stories you have approved here (${appr.length}) and the children's pages (${apprKids.length}). The phone replaces its additional stories with exactly what the file holds.</p>
    ${appr.length || apprKids.length ? `<ul>${appr.map((d) => `<li>${esc(d.title)}</li>`).join("")}${apprKids.map((d) => `<li>${esc(d.title)} (children)</li>`).join("")}</ul>` : `<p class="muted">Nothing approved yet.</p>`}
    <div class="actions"><button class="b primary" id="mk" ${appr.length || apprKids.length ? "" : "disabled"}>Make the file</button></div>
    ${S.capacity ? `<p class="${S.capacity.pictures > S.capacity.maxPictures || (S.capacity.kidPictures || 0) > S.capacity.maxPictures || S.capacity.bytes > S.capacity.maxBytes ? "problem" : "muted"}"><b>How full the phone's file would be:</b> ${S.capacity.pictures} story pictures and ${S.capacity.kidPictures || 0} children's pictures (the phone takes at most ${S.capacity.maxPictures} of each) and about ${(S.capacity.bytes / 1048576).toFixed(1)} MB (at most ${(S.capacity.maxBytes / 1048576).toFixed(0)} MB).${S.capacity.pictures > S.capacity.maxPictures || (S.capacity.kidPictures || 0) > S.capacity.maxPictures || S.capacity.bytes > S.capacity.maxBytes ? " <b>Too many for one file: approve fewer stories with pictures for now, or the next phone version must raise the limits.</b>" : ""}</p>` : ""}
    <p class="sub">This only makes the file on this computer. It does NOT put it on the internet: publishing is a separate step done only when you say so, and nothing is published without your word.</p>
    <div id="mkres"></div></div>`;
  const b = $("#mk"); if (b) b.onclick = async () => {
    b.disabled = true; $("#mkres").innerHTML = `<p class="muted">Making the file…</p>`;
    const r = await api("/api/build", {});
    $("#mkres").innerHTML = r.ok ? `<p class="passes">The file is made.</p><p>${(r.bytes / 1024).toFixed(0)} KB, in the batch folder <code>${esc(r.batch)}</code>.<br>Fingerprint: <code>${esc(r.sha)}</code></p><p>Ready to publish: <code>installer\\packs\\ready-to-upload\\extra-pages.json</code>. Say "publish the new stories" when you are happy.</p>` : `<p class="problem">${esc(r.text || r.error)}</p>`;
    await load(); tab = "make";
  };
}
load();
</script>
